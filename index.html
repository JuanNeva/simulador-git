const WEEK_FILES={"diario_semana1.txt": "LABORATORIO CHRONO - DIARIO PERSONAL\nSemana 1\n\nHoy he empezado a experimentar con ¡GIT!.\n\nAl principio me pareció una simple herramienta para guardar versiones de\nunos archivos. Una especie de cuaderno que no se pierde. Pero cuanto más\nla uso, más me doy cuenta de lo que realmente es: una herramienta\npoderosísima.\n\nCada commit es una fotografía exacta de mi trabajo en un instante concreto.\nNo es una copia aproximada ni un recuerdo borroso: es el momento tal cual\nera, con todo lo que contenía. Y esas fotografías se quedan ahí,\nordenadas una detrás de otra, para siempre.\n\nLlevo toda la vida estudiando el tiempo. Y resulta que alguien ya\nconstruyó una máquina que lo guarda en instantáneas, y se llama Git.\n\nMañana seguiré leyendo la documentación. Tengo la sensación de que esto\npuede cambiarlo todo.\n", "diario_semana2.txt": "LABORATORIO CHRONO - DIARIO PERSONAL\nSemana 2\n\nHe pasado la noche leyendo sobre los comandos de Git. Casi todos son\ninofensivos: status mira, log lee, add prepara. Ninguno toca nada\nimportante.\n\nPero hay uno que aparece en todos los foros con la misma advertencia:\n¡CHECKOUT!.\n\n\"Cuidado con checkout.\" \"No lo uses si no sabes lo que haces.\"\n\"Puede dejarte en un estado muy raro.\"\n\nLo he leído una y otra vez. Y cuanto más me advierten, más me interesa.\n\nPorque checkout permite situarse en cualquier instantánea del pasado.\nNo solo mirarla: colocarse dentro de ella. Si cada commit es un momento\nguardado, este comando es la forma de regresar a él.\n\nSé que es peligroso. Lo sé. Pero tengo que examinarlo con calma, probarlo\nen pequeño y entender exactamente qué hace antes de dar ningún paso\nmás. Un comando así no se ejecuta a ciegas.\n\nEsta noche empiezo a estudiarlo.\n", "diario_semana3.txt": "LABORATORIO CHRONO - DIARIO PERSONAL\nSemana 3\n\nYa sé lo que voy a hacer.\n\nLlevo semanas dándole vueltas, y esta noche por fin lo he visto claro.\nTodo lo que he estado estudiando, la máquina, las instantáneas,\nel comando checkout, ha sido para esto.\n\nVoy a volver al pasado. A un momento concreto, que he guardado con mucho\ncuidado, y que es el único lugar en el mundo donde quiero estar.\n\nVoy a estar con mi hija.\n\nSé que no debería. Sé lo que dicen las advertencias. Sé que ese comando\npuede dejarme atrapada en un punto del historial sin camino de vuelta.\nPero ahí, en esa fotografía, ella todavía está. Y yo llevo demasiado\ntiempo sin poder abrazarla.\n\nLo haré al día ¡14-AGOSTO!, a las 3:17, el día en el que todo se detuvo. No voy a esperar\nmás.\n\nSi alguien lee esto: no me busquéis en el presente. Estaré donde el tiempo\nse quedó parado.\n"};

const STEP_W=6/STEPS.length,Q_W=4/QS.length;
const fmt=n=>n.toFixed(2).replace('.',',');
const isDone=s=>!!S.done[s.id];
function latch(){STEPS.forEach(x=>{if(!S.done[x.id]&&x.d())S.done[x.id]=1})}
const stepPts=s=>!isDone(s)?0:(S.hints[s.id]?.5:1)*STEP_W;
const qOk=q=>!!(S.q[q.id]&&S.q[q.id].ok);
const qDone=q=>!!(S.q[q.id]&&(S.q[q.id].done||S.q[q.id].ok));
const score=()=>STEPS.reduce((t,s)=>t+stepPts(s),0)+QS.reduce((t,q)=>t+(qOk(q)?Q_W:0),0);
const stepsDone=p=>STEPS.filter(s=>s.p===p).every(s=>isDone(s));
const qsDone=p=>QS.filter(q=>q.p===p).every(qDone);
const phaseDone=p=>stepsDone(p)&&qsDone(p);
function notify(){latch();for(let p=1;p<=4;p++)if(!S.notified[p]&&phaseDone(p)){S.notified[p]=1;out(p<4?`✔ Fase ${p} completada. Pasa a la siguiente desde el panel de la izquierda.`:'✔ Fase 4 completada. Nivel 1 superado.','g')}}
function run(line){S.lines.push({k:'cmd',p:prompt(),t:line});const raw=line.trim();if(!raw)return;S.hist.push(raw);if(S.hist.length>200)S.hist.shift();
 const a=tok(raw);if(!a){out('bash: comillas sin cerrar','e');return}
 const c=a[0],fn=CMDS[c];
 try{if(fn)fn(a.slice(1));else out(`${c}: comando no encontrado. Escribe help para ver los disponibles.`,'e')}catch(e){out('Error interno del simulador: '+e.message,'e')}
 notify();if(S.lines.length>400)S.lines=S.lines.slice(-300)}
function complete(buf){const m=/^(.*?)(\S*)$/.exec(buf),hd=m[1],w=m[2],toks=hd.trim()?hd.trim().split(/\s+/):[];let c;
 if(!toks.length)c=['pwd','ls','cd','mkdir','touch','cat','cp','echo','rm','clear','help','git'];
 else if(toks[0]==='git'&&toks.length===1)c=['init','status','clone','config','add','commit','log'];
 else{const i=w.lastIndexOf('/'),dp=i>=0?w.slice(0,i+1):'',dir=resolve(dp||'.');c=isDir(dir)?children(dir).map(bn).filter(n=>!n.startsWith('.')||w.slice(i+1).startsWith('.')).map(n=>dp+n+(isDir(join(dir,n))?'/':'')):[]}
 const mt=c.filter(x=>x.startsWith(w)).sort();if(!mt.length)return{buf,opts:[]};
 if(mt.length===1)return{buf:hd+mt[0]+(mt[0].endsWith('/')?'':' '),opts:[]};
 let p=mt[0];for(const x of mt)while(!x.startsWith(p))p=p.slice(0,-1);return{buf:hd+p,opts:mt}}
/*SIM-END*/

function ptsText(s){return isDone(s)?'+'+fmt(stepPts(s))+' pts':S.hints[s.id]?fmt(STEP_W/2)+' pts (con pista)':fmt(STEP_W)+' pts'}
function stepExtra(s){
 if(s.x==='url')return `<div class="box"><div>URL del repositorio</div><div class="row"><input type="text" id="url" readonly value="${esc(REPO_URL)}" aria-label="URL del repositorio"><button type="button" class="btn" data-act="copy">${ui.copied?'Copiada':'Copiar'}</button></div></div>`;
 if(s.x==='code')return `<div class="box"><div class="row"><input type="text" id="codein" inputmode="numeric" maxlength="12" placeholder="Código de 5 cifras" aria-label="Código secreto" ${S.code?'value="52814" disabled':''}><button type="button" class="btn pri" data-act="code" ${S.code?'disabled':''}>Comprobar</button></div>${S.code?'<p class="fb ok">Código correcto. La puerta secreta se abre.</p>':ui.codeMsg?`<p class="fb bad">${ui.codeMsg}</p>`:''}</div>`;
 return ''}
function renderIntro(){const ns=STEPS.length,nq=QS.length;
 return `<div class="card"><div class="kick">Agencia de Preservación Temporal</div><h2>Caso abierto: la desaparición de la Dra. Chrono</h2>
 <p class="story">Eres un agente de la Agencia de Preservación Temporal y esta mañana te han llamado para un caso. La Dra. Chrono, una científica excéntrica, ha desaparecido sin dejar rastro. Nadie sabe nada, solo que trabajaba sin parar en su laboratorio. Muchos decían que nunca salía de él, e incluso pensaban que tanto trabajo estaba mermando su salud mental.</p>
 <p class="goal"><b>Misión.</b> Reconstruir la historia de la Dra. Chrono siguiendo sus rastros y averiguar dónde está. Tu herramienta es Git y tu cuaderno de campo, un repositorio.</p></div>
 <div class="card"><h3>Cómo se trabaja</h3><ul>
 <li>En esta columna tienes la historia, los ejercicios y las preguntas de cada fase. Los ejercicios no se marcan a mano: se marcan solos cuando haces lo que piden.</li>
 <li>Los comandos los escribes tú en el terminal de la derecha. Los necesarios están en el guión de la práctica.</li>
 <li>Encima del terminal verás una escena con tu diario, el de la Dra. Chrono y las tres zonas de Git (directorio de trabajo, preparación y repositorio). Cambia con cada comando.</li>
 <li>En el terminal, Tab autocompleta y las flechas ↑ ↓ recuperan comandos. Escribe <code>help</code> para ver los comandos disponibles.</li><li>Para leer un archivo, escribe <code>cat nombre</code> o púlsalo en la zona «Directorio de trabajo» de la escena.</li><li><b>Limpiar</b> solo borra el texto de la pantalla del terminal. No cambia tus archivos, tus repositorios ni tu nota.</li><li><b>Reiniciar entorno</b> vacía el escritorio simulado: borra las carpetas, archivos y repositorios que hayas creado y te devuelve a la carpeta inicial. Úsalo solo si te has atascado. Tu nota, tus ejercicios completados y tus respuestas se conservan, y los ejercicios ya completados no vuelven a dar puntos.</li></ul></div>
 <div class="card"><h3>Puntuación</h3><div class="tw"><table><thead><tr><th>Parte</th><th class="n">Cantidad</th><th class="n">Cada una</th><th class="n">Total</th></tr></thead><tbody>
 <tr><td>Ejercicios</td><td class="n">${ns}</td><td class="n">${fmt(STEP_W)}</td><td class="n">${fmt(STEP_W*ns)}</td></tr>
 <tr><td>Preguntas de comprobación</td><td class="n">${nq}</td><td class="n">${fmt(Q_W)}</td><td class="n">${fmt(Q_W*nq)}</td></tr></tbody>
 <tfoot><tr><td colspan="3">Nota máxima</td><td class="n">10,00</td></tr></tfoot></table></div>
 <ul style="margin-top:12px"><li>Si abres la <b>pista</b> de un ejercicio antes de completarlo, ese ejercicio vale la mitad. Basta con desplegarla.</li>
 <li>Para pasar a la siguiente fase debes completar todos sus ejercicios y responder todas sus preguntas. Cada pregunta tiene un solo intento: si fallas, esa pregunta vale 0 puntos, pero puedes continuar.</li>
 <li>Tu nota aparece arriba a la derecha. Tu progreso se guarda solo y no se pierde al cerrar la pestaña. Ningún botón de la página reinicia la nota. Para que se guarde debes entrar con tu cuenta de la universidad.</li>
 <li>Los entregables de cada fase (capturas del terminal) se entregan aparte, según indique el guión.</li></ul></div>
 <div class="card"><h3>Antes de empezar</h3><ul><li>Ejecuta <code>git status</code> con frecuencia. Es inofensivo y te orienta siempre.</li><li>Comprueba en qué carpeta estás antes de usar comandos de Git. Fuera de un repositorio, Git responde <code>fatal: not a git repository</code>.</li><li>Lee lo que te devuelve el terminal. Los mensajes de Git suelen explicar el siguiente paso.</li></ul>
 <div class="row" style="margin-top:14px"><button type="button" class="btn pri" data-act="start">Aceptar el caso</button></div></div>`}
function renderPanel(){if(auth.status==='checking'){$('panel').innerHTML='<div class="card"><h3>Comprobando tu acceso…</h3><p class="deliv" style="margin:0">Un momento, estamos recuperando tu progreso.</p></div>';return}
 if(auth.gate){$('panel').innerHTML=renderGate();return}
 if(S.view===5&&!isStaff())S.view=1;
 const n=S.view;if(n===0){$('panel').innerHTML=renderIntro();return}
 if(n===5){$('panel').innerHTML=renderResults();return}
 const P=PH[n-1],st=STEPS.filter(s=>s.p===n),qs=QS.filter(q=>q.p===n),dn=phaseDone(n),allDone=[1,2,3,4].every(phaseDone);
 let h='';
 if(allDone)h+=`<div class="card win"><h3>Nivel 1 superado</h3><p style="margin:0">La Dra. Chrono está a salvo. Tu nota es <b>${fmt(score())} / 10</b>. Recuerda preparar los entregables de cada fase y continúa con el Nivel 2.</p></div>`;
 h+=`<div class="card"><div class="kick">Fase ${n} de 4</div><h2>${P.n}</h2><p class="story">${P.story}</p><p class="goal"><b>Objetivo.</b> ${P.goal}</p></div>`;
 h+=`<div class="card"><h3>Ejercicios</h3><ol class="steps">${st.map(s=>`<li class="step${isDone(s)?' done':''}"><span class="tick" aria-hidden="true">✓</span><div class="st"><div>${s.t}<span class="pts">${ptsText(s)}</span></div>${stepExtra(s)}<details data-h="${s.id}" ${ui.open.has(s.id)?'open':''}><summary>Pista${isDone(s)||S.hints[s.id]?'':' (el ejercicio pasa a valer la mitad)'}</summary><div>${s.h}</div></details></div></li>`).join('')}</ol></div>`;
 h+=`<div class="card"><h3>Preguntas de comprobación</h3><p class="deliv" style="margin:0">Cada pregunta tiene un solo intento. Si fallas, esa pregunta vale 0 puntos y puedes continuar.</p>${qs.map(q=>{const s=S.q[q.id]||{},done=qDone(q),L='ABC';const res=done?(s.ok?`<p class="fb ok">Correcto. ${q.e}</p>`:`<p class="fb bad">Incorrecta: esta pregunta vale 0 puntos. La respuesta correcta era la ${L[q.a]}. ${q.e}</p>`):`<div class="row" style="margin-top:6px"><button type="button" class="btn" data-act="q" data-q="${q.id}">Responder (un solo intento)</button></div>`;return `<fieldset data-q="${q.id}"><legend>${q.q} <span class="pts">${done?(s.ok?'+'+fmt(Q_W):'0,00'):fmt(Q_W)} pts</span></legend>${q.o.map((o,k)=>`<label><input type="radio" name="${q.id}" value="${k}" ${s.sel===k?'checked':''} ${done?'disabled':''}><span><b>${L[k]})</b> ${o}</span></label>`).join('')}${res}</fieldset>`}).join('')}</div>`;
 const rs=st.filter(s=>!isDone(s)).length,rq=qs.filter(q=>!qDone(q)).length;
 h+=`<div class="card"><h3>Entregable</h3><p class="deliv" style="margin:0">${P.deliv}</p>${dn?(n<4?`<div class="row" style="margin-top:12px"><button type="button" class="btn pri" data-act="next">Continuar a la fase ${n+1}</button></div>`:'<p class="deliv" style="margin:12px 0 0">Has completado el Nivel 1.</p>'):`<p class="deliv" style="margin:12px 0 0">Para pasar de fase te falta: ${[rs?rs+(rs===1?' ejercicio':' ejercicios'):'',rq?rq+(rq===1?' pregunta':' preguntas'):''].filter(Boolean).join(' y ')}.</p>`}</div>`;
 const el=document.activeElement,keep=el&&el.id==='codein'?el.value:null;
 $('panel').innerHTML=h;if(keep!==null&&$('codein')){$('codein').value=keep;$('codein').focus()}}
function renderTerm(){const o=$('out');o.innerHTML=S.lines.map(l=>l.k==='cmd'?`<div><span class="p">${esc(l.p)}</span> ${esc(l.t)}</div>`:l.h!==undefined?`<div>${l.h}</div>`:`<div class="${l.c||'o'}">${esc(l.t)||' '}</div>`).join('');o.scrollTop=o.scrollHeight;$('pr').textContent=prompt()}
const book=c=>`<svg class="bk ${c}" viewBox="0 0 40 48" aria-hidden="true"><rect class="cov" x="4" y="3" width="32" height="42" rx="3"/><rect class="sp" x="4" y="3" width="6" height="42" rx="2"/><rect class="pg" x="15" y="12" width="15" height="3" rx="1.5"/><rect class="pg" x="15" y="19" width="11" height="3" rx="1.5"/></svg>`;
const monitor=`<svg class="mon" viewBox="0 0 32 30" aria-hidden="true"><rect x="2" y="2" width="28" height="18" rx="2"/><path d="M11 27h10M16 20v7"/></svg>`;
function focusRoot(){if(ui.focus&&S.repos[ui.focus])return ui.focus;return findRepo(S.cwd)||Object.keys(S.repos)[0]||null}
function renderScene(){const keys=new Set(),nw=k=>{keys.add(k);return ui.keys&&!ui.keys.has(k)?' new':''};
 const dR=repoByName('diario-del-agente'),cR=repoByName('laboratorio-chrono'),fr=focusRoot();
 const state=x=>{const i=info(x.root);return `${x.r.commits.length} ${x.r.commits.length===1?'commit':'commits'}${i.clean?'':' · cambios sin guardar'}`};
 let h='<h3>Escena · tu escritorio de agente</h3><div class="tiles">';
 h+=`<div class="tile"><div class="ti">${monitor}</div><div class="tt"><b>Ordenador del laboratorio</b><span>repositorio remoto</span><em>${CHRONO.length} commits · diarios de las semanas 1 a 3</em></div></div>`;
 h+=dR?`<button type="button" class="tile${fr===dR.root?' sel':''}${nw('t:d')}" data-root="${esc(dR.root)}"><div class="ti">${book('')}</div><div class="tt"><b>Diario del agente</b><span>repositorio local · .git creado</span><em>${state(dR)}</em></div></button>`:`<div class="tile off"><div class="ti">${book('')}</div><div class="tt"><b>Sin diario todavía</b><span>Crea uno con git init</span></div></div>`;
 h+=cR?`<button type="button" class="tile${fr===cR.root?' sel':''}${nw('t:c')}" data-root="${esc(cR.root)}"><div class="ti">${book('rem')}</div><div class="tt"><b>Diario de la Dra. Chrono</b><span>copia clonada · origin</span><em>${state(cR)}</em></div></button>`:`<div class="tile off"><div class="ti">${book('rem')}</div><div class="tt"><b>Sin copia todavía</b><span>Tráela con git clone</span></div></div>`;
 h+='</div>';
 if(!fr)h+='<p class="empty" style="margin-top:12px">Todavía no hay ningún repositorio. Cuando crees uno, aquí verás sus tres zonas: directorio de trabajo, preparación y repositorio.</p>';
 else{const i=info(fr),sc=scan(fr),r=i.r,hd=head(r),rn=bn(fr);
  const files=Object.keys(sc.work).sort().map(rel=>{const st=!(rel in r.index)?'u':sc.work[rel]!==r.index[rel]?'m':(rel in hd&&hd[rel]===r.index[rel])?'k':'s';return `<li class="fli"><button type="button" class="fc ${st}${nw('w:'+fr+rel+st)}${ui.file&&ui.file.root===fr&&ui.file.rel===rel?' on':''}" data-f="${esc(rel)}">${esc(rel)}</button></li>`}).concat(sc.nested.map(d=>`<li class="fc u${nw('w:'+fr+d)}">${esc(d)}/</li>`)).join('');
  const stg=i.staged.map(([t,k])=>`<li class="fc s${nw('s:'+fr+k)}">${esc(k)}</li>`).join('');
  const cms=r.commits.map((c,ix)=>({c,ix})).reverse().map(({c,ix})=>`<li class="cm${nw('c:'+fr+c.h)}"><span class="h">${c.h.slice(0,7)}</span><span class="ms">${esc(c.msg)}</span>${ix===r.commits.length-1?'<span class="pill">HEAD</span>':''}${r.remote&&ix===r.originIdx?'<span class="pill o">origin</span>':''}</li>`).join('');
  const vp=ui.file&&ui.file.root===fr?fr+'/'+ui.file.rel:null,vf=vp&&S.fs[vp]&&!S.fs[vp].d?S.fs[vp].c:null;
  const viewer=vf===null?'':`<div class="viewer"><div class="vh"><span>${esc(ui.file.rel)}</span><button type="button" data-close="1">Cerrar</button></div><pre>${esc(vf)||' '}</pre></div>`;
  h+=`<div class="fh"><span>Repositorio en foco: <b>${esc(rn)}</b></span><span class="empty">pulsa un diario para cambiarlo o un archivo para leerlo</span></div><div class="zones">
  <div class="zone"><h4>Directorio de trabajo</h4><small>tus archivos</small><ul>${files||'<li class="empty">Vacío</li>'}</ul></div>
  <div class="zone"><h4>Preparación</h4><small>git add los trae aquí</small><ul>${stg||'<li class="empty">Nada preparado</li>'}</ul></div>
  <div class="zone"><h4>Repositorio</h4><small>git commit los guarda · el más reciente arriba</small><ul>${cms||'<li class="empty">Sin commits</li>'}</ul></div></div>
  ${viewer}<p class="lg">Archivos: rojo sin seguir · amarillo modificado · verde preparado · gris guardado</p>`}
 $('scene').innerHTML=h;ui.keys=keys}
function renderAll(){renderWho();renderRing();renderPhases();renderPanel();renderScene();renderTerm()}
load();if(!S.lines.length)welcome();
if(!unlocked(S.view))S.view=1;
renderAll();
initCloud();
const hist={i:0};
$('cmd').addEventListener('keydown',e=>{const el=e.target;
 if(e.key==='Enter'){const v=el.value;el.value='';ui.focus=null;run(v);hist.i=S.hist.length;save();renderAll();el.focus()}
 else if(e.key==='ArrowUp'){e.preventDefault();if(hist.i>0)hist.i--;el.value=S.hist[hist.i]||''}
 else if(e.key==='ArrowDown'){e.preventDefault();if(hist.i<S.hist.length)hist.i++;el.value=S.hist[hist.i]||''}
 else if(e.key==='Tab'){e.preventDefault();const r=complete(el.value);el.value=r.buf;if(r.opts.length){S.lines.push({k:'cmd',p:prompt(),t:el.value});out(r.opts.join('  '),'dim');renderTerm()}}
 else if(e.key==='l'&&e.ctrlKey){e.preventDefault();S.lines=[];renderTerm()}});
$('out').addEventListener('click',()=>{if(!getSelection().toString())$('cmd').focus()});
$('bClear').addEventListener('click',()=>{S.lines=[];save();renderTerm();$('cmd').focus()});
let rt=null;$('bReset').addEventListener('click',e=>{const b=e.currentTarget;if(rt){clearTimeout(rt);rt=null;{const k={done:S.done,hints:S.hints,q:S.q,code:S.code,view:S.view,notified:S.notified,rev:S.rev,email:S.email};S=Object.assign(fresh(),k)}ui.codeMsg=null;ui.focus=null;ui.keys=null;welcome();save();b.textContent='Reiniciar entorno';renderAll();return}b.textContent='¿Seguro? Pulsa otra vez';rt=setTimeout(()=>{rt=null;b.textContent='Reiniciar entorno'},3500)});
$('phases').addEventListener('click',e=>{const b=e.target.closest('[data-ph]');if(!b||b.disabled)return;S.view=+b.dataset.ph;save();renderPhases();renderPanel()});
$('scene').addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){ui.file={root:focusRoot(),rel:f.dataset.f};renderScene();const v=$('scene').querySelector('.viewer');if(v)v.scrollIntoView({block:'nearest'});return}if(e.target.closest('[data-close]')){ui.file=null;renderScene();return}const b=e.target.closest('[data-root]');if(!b)return;ui.focus=b.dataset.root;renderScene()});
$('panel').addEventListener('toggle',e=>{const d=e.target,id=d.dataset&&d.dataset.h;if(!id)return;
 if(d.open){ui.open.add(id);const s=STEPS.find(x=>x.id===id);if(s&&!isDone(s)&&!S.hints[id]){S.hints[id]=1;save();renderRing();const b=d.closest('.step').querySelector('.pts');if(b)b.textContent=ptsText(s);const sm=d.querySelector('summary');if(sm)sm.textContent='Pista'}}else ui.open.delete(id)},true);
$('panel').addEventListener('change',e=>{const t=e.target;if(t.type==='radio'){const id=t.name;if(S.q[id]&&(S.q[id].done||S.q[id].ok))return;S.q[id]=Object.assign(S.q[id]||{},{sel:+t.value});save()}});
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='start'){S.view=1;save();renderPhases();renderPanel();window.scrollTo({top:0,behavior:'smooth'})}
 else if(a==='next'){S.view=Math.min(4,S.view+1);save();renderPhases();renderPanel();window.scrollTo({top:0,behavior:'smooth'})}
 else if(a==='q'){const q=QS.find(x=>x.id===b.dataset.q),s=S.q[q.id]||{};if(s.sel===undefined||qDone(q))return;s.ok=s.sel===q.a;s.done=true;S.q[q.id]=s;notify();save();renderAll()}
 else if(a==='code'){const v=($('codein').value||'').replace(/\s/g,'');if(v==='52814'){S.code=true;ui.codeMsg=null;out('✔ Código 52814 aceptado. Se abre la puerta secreta.','g');notify();save();renderAll()}else{ui.codeMsg=v?'Ese no es el código. Revisa las cifras de cada mensaje y el orden en que las has juntado.':'Escribe las 5 cifras.';renderPanel()}}
 else if(a==='login'){const v=(($('emailin')||{}).value||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){auth.note='Escribe un correo válido.'}else if(!okDomain(v)){auth.note='Usa tu correo de la universidad ('+UNI_DOMAINS.map(d=>'@'+d).join(' o ')+').'}else{S.email=v;auth.note='';evalGate();save();renderAll();return}renderPanel()}
 else if(a==='csv'){(async()=>{try{const dl=await claude.use('downloads');if(!dl)return;const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const csv='\ufeff'+['Alumno','Correo','Nota','Tareas hechas','Tareas totales','Fases completadas','Última actividad'].map(q).join(';')+'\n'+(ui.results||[]).map(r=>[r.name||'',r.email||'',fmt(r.score||0),r.items||0,r.total||0,r.phases||0,r.updated?new Date(r.updated).toLocaleString('es-ES'):''].map(q).join(';')).join('\n');await dl.save({filename:'resultados-git-nivel1.csv',data:csv})}catch(e){}})()}
 else if(a==='copy'){const u=$('url');const done=()=>{ui.copied=true;b.textContent='Copiada';setTimeout(()=>{ui.copied=false;b.textContent='Copiar'},1800)};
  try{navigator.clipboard.writeText(REPO_URL).then(done,()=>{u.select()})}catch(err){u.select()}}});
$('panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='emailin'){e.preventDefault();$('panel').querySelector('[data-act=login]').click();return}if(e.key==='Enter'&&e.target.id==='codein'){e.preventDefault();e.target.closest('.box').querySelector('[data-act=code]').click()}});
</script>

</body></html>
